x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
    max-file: "${DOCKER_LOG_MAX_FILE:-5}"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-xihong}
      POSTGRES_USER: ${DATABASE_USER:-xihong}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-xihong} -d ${POSTGRES_DB:-xihong}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    volumes:
      - redis_data:/data
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: src/backend-kotlin
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-xihong}
      DATABASE_USER: ${DATABASE_USER:-xihong}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      APP_PRODUCTION: "true"
      ALLOW_MOCK_USER: ${ALLOW_MOCK_USER:?ALLOW_MOCK_USER is required}
      WX_PAY_MOCK: ${WX_PAY_MOCK:?WX_PAY_MOCK is required}
      USER_TOKEN_SECRET: ${USER_TOKEN_SECRET:?USER_TOKEN_SECRET is required}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?ADMIN_JWT_SECRET is required}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:?ADMIN_BOOTSTRAP_EMAIL is required}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:?ADMIN_BOOTSTRAP_PASSWORD is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      WECHAT_ORIGINAL_ID: ${WECHAT_ORIGINAL_ID:?WECHAT_ORIGINAL_ID is required}
      WECHAT_APPID: ${WECHAT_APPID:?WECHAT_APPID is required}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:?WECHAT_APP_SECRET is required}
      WECHAT_MESSAGE_TOKEN: ${WECHAT_MESSAGE_TOKEN:?WECHAT_MESSAGE_TOKEN is required}
      WECHAT_MESSAGE_AES_KEY: ${WECHAT_MESSAGE_AES_KEY:?WECHAT_MESSAGE_AES_KEY is required}
      WX_PAY_APPID: ${WX_PAY_APPID:?WX_PAY_APPID is required}
      WX_PAY_MCH_ID: ${WX_PAY_MCH_ID:?WX_PAY_MCH_ID is required}
      WX_PAY_API_V3_KEY: ${WX_PAY_API_V3_KEY:?WX_PAY_API_V3_KEY is required}
      WX_PAY_SERIAL_NO: ${WX_PAY_SERIAL_NO:?WX_PAY_SERIAL_NO is required}
      WX_PAY_PUBLIC_KEY_ID: ${WX_PAY_PUBLIC_KEY_ID:?WX_PAY_PUBLIC_KEY_ID is required}
      LEGACY_SQLITE_PATH: /legacy/xihong.sqlite3
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://api.xihongzhubao.com}
      WECHAT_MESSAGE_CALLBACK_URL: ${WECHAT_MESSAGE_CALLBACK_URL:-https://api.xihongzhubao.com/wechat/miniprogram/message-push}
    volumes:
      - backend_data:/legacy:ro
      - backend_uploads:/app/uploads
      - ${WX_PAY_CERT_DIR:-./secrets/wechatpay}:/run/secrets/wechatpay:ro
    group_add:
      - "${WX_PAY_CERT_GID:-10001}"
    logging: *default-logging
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  backstage:
    build:
      context: .
      dockerfile: src/backstage/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: ${PUBLIC_BASE_URL:-https://api.xihongzhubao.com}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    expose:
      - "3000"
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  ar_h5:
    build:
      context: .
      dockerfile: deploy/ar_h5/Dockerfile
    restart: unless-stopped
    expose:
      - "3020"
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3020/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      backstage:
        condition: service_healthy
      ar_h5:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  backend_data:
  backend_uploads:
  postgres_data:
  redis_data:
